name: Refresh news and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 09:17 / 17:17 Asia/Shanghai. Scheduled runs may be delayed.
    - cron: '17 1,9 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect permitted RSS and Atom sources
        id: collect
        continue-on-error: true
        run: python tools/collect_news.py
      - name: Keep updated snapshots in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/news.json dist/collection-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update policy news snapshot'
            git push
          fi
      - name: Report source failures
        if: steps.collect.outcome == 'failure'
        run: echo 'Collection failed. Last good snapshot is retained; inspect collection-status.json.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
